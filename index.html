<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚨 BEULAH ALERT 🚨</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Comic Sans MS, cursive, sans-serif;
      background: linear-gradient(135deg, #ff00aa, #7200ff, #00eaff);
      animation: rainbow 4s infinite alternate;
    }

    @keyframes rainbow {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .box {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 8px dashed #000;
      border-radius: 30px;
      padding: 40px;
      max-width: 700px;
      box-shadow: 0 0 40px #fff, 15px 15px 0 #000;
      transform: rotate(-2deg);
    }

    h1 {
      font-size: clamp(45px, 10vw, 100px);
      margin: 0;
      color: #ff1493;
      text-shadow: 5px 5px #ffff00, 9px 9px #000;
      animation: wobble 0.5s infinite alternate;
    }

    @keyframes wobble {
      from {
        transform: rotate(-3deg) scale(1);
      }

      to {
        transform: rotate(3deg) scale(1.05);
      }
    }

    p {
      font-size: 25px;
      font-weight: bold;
    }

    button {
      border: 4px solid #000;
      border-radius: 15px;
      padding: 15px 25px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      background: #00ff66;
      box-shadow: 6px 6px #000;
    }

    button:active {
      transform: translate(6px, 6px);
      box-shadow: none;
    }

    .emoji {
      position: fixed;
      font-size: 40px;
      animation: fall 5s linear infinite;
    }

    @keyframes fall {
      from {
        transform: translateY(-100px) rotate(0deg);
      }

      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    #message {
      min-height: 35px;
      margin-top: 20px;
      color: #7b00ff;
    }
  </style>
</head>

<body>

  <div class="emoji" style="left: 10%; animation-delay: 0s;">🦆</div>
  <div class="emoji" style="left: 30%; animation-delay: 1s;">🍌</div>
  <div class="emoji" style="left: 55%; animation-delay: 2s;">🧀</div>
  <div class="emoji" style="left: 80%; animation-delay: 3s;">🦖</div>

  <main class="box">

    <div style="font-size: 60px;">🚨😂🚨</div>

    <h1>
      BEULAH<br>
      IS A DORK
    </h1>

    <p>⚠️ THIS IS A VERY SERIOUS WEBSITE ⚠️</p>

    <p>
      Scientists have conducted absolutely zero research
      and reached this conclusion.
    </p>

    <button onclick="reveal()">
      CLICK FOR IMPORTANT INFORMATION
    </button>

    <div id="message"></div>

  </main>

  <script>
    function reveal() {
      const messages = [
        "🦆 The ducks have confirmed it.",
        "🚨 DORK LEVEL: EXTREME",
        "🍌 Authorities have been notified.",
        "🧀 Beulah has been officially certified silly.",
        "🦖 There is no appeal.",
        "😂 Sorry Beulah. The website doesn't lie."
      ];

      document.getElementById("message").textContent =
        messages[Math.floor(Math.random() * messages.length)];
    }
  </script>

</body>
</html>
